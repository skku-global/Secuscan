name: secuscan
region: nyc

services:
  - name: backend
    source_dir: /backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      # In DigitalOcean App Platform, routes strip the path prefix by default (preserve_path_prefix: false).
      # Requests to https://${APP_URL}/api/xyz arrive at FastAPI as /xyz, matching main.py routes directly.
      - path: /api
    health_check:
      http_path: /auth/config
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      # --- Database -------------------------------------------------------------
      # DigitalOcean does not offer managed MongoDB; supply external connection string (e.g. Atlas).
      - key: SECUSCAN_MONGO_URL
        type: SECRET
        value: "mongodb+srv://<db_user>:<db_password>@<cluster>.mongodb.net/secuscan?retryWrites=true&w=majority"

      # --- Product Identity & Origin --------------------------------------------
      - key: SECUSCAN_APP_NAME
        value: "SecuScan"
      - key: SECUSCAN_APP_URL
        value: "${APP_URL}"
      - key: SECUSCAN_CORS_ORIGINS
        value: "${APP_URL}"

      # --- Authentication & 2FA -------------------------------------------------
      - key: SECUSCAN_REQUIRE_2FA
        value: "false"
      - key: SECUSCAN_GOOGLE_CLIENT_ID
        value: "your-google-oauth-client-id.apps.googleusercontent.com"

      # --- Email Delivery (Resend) ----------------------------------------------
      - key: SECUSCAN_EMAIL_PROVIDER
        value: "resend"
      - key: RESEND_API_KEY
        type: SECRET
        value: "re_your_resend_api_key_placeholder"
      - key: SECUSCAN_EMAIL_FROM
        value: "SecuScan <security@yourdomain.com>"

      # WHERE THE CONTACT FORM'S MESSAGES LAND, and NOT a second copy of the line
      # above. EMAIL_FROM is the address this server sends AS, and has to be on a
      # domain verified with Resend. This is the ordinary mailbox a person reads
      # when a signed-in user asks for help through Settings, so it can be any
      # address that actually receives mail.
      #
      # It has a working default in config.py, so leaving this out does not break a
      # deployment - it is here because a deployment whose support mailbox differs
      # from the default has no other way to say so, and searching the source for
      # the address is not that way.
      #
      # The frontend has its own copy in lib/pricing.js for the mailto: links a
      # browser opens directly. That one is baked into the static bundle at build
      # time and cannot read this, so the two are changed together on purpose.
      - key: SECUSCAN_SUPPORT_EMAIL
        value: "support@yourdomain.com"

      # --- Payments (Paddle) ----------------------------------------------------
      #
      # THIS SHIPPED AS "mock" AND THAT WAS A LIVE HAZARD. Every value in this
      # block is a placeholder, so the spec as written deployed a public server
      # whose checkout grants paid plans to anyone who types a card number that
      # passes a Luhn checksum. No money moves and no card is authorised - the
      # customer simply gets the plan for free. A deployment spec must not be able
      # to do that by being applied unedited.
      #
      # It is "paddle" now, with placeholder credentials, so an unedited apply
      # gives the SAFE failure instead: PaddleProvider refuses to construct, the
      # server boots, scanning and sign-in work, and only POST /billing/checkout
      # answers 503. payments/__init__.py deliberately does not substitute the
      # mock for a Paddle that would not configure.
      #
      # REPLACE EVERY PLACEHOLDER BELOW BEFORE APPLYING. They are not defaults;
      # they are the shape of the value you need to paste in. The mock provider is
      # for local development only - set SECUSCAN_PAYMENT_PROVIDER=mock in a .env
      # on your own machine, never in a deployed spec.
      - key: SECUSCAN_PAYMENT_PROVIDER
        value: "paddle"

      # "true" charges nothing and uses Paddle's sandbox. Set it to exactly
      # "false" to charge real cards, and switch every credential below to a live
      # one at the same time - sandbox and live Paddle are separate accounts that
      # share no credentials, and a sandbox key used against the live API returns
      # `forbidden`. config.py warns at startup when the two disagree.
      - key: SECUSCAN_PADDLE_SANDBOX
        value: "true"
      - key: SECUSCAN_PADDLE_CLIENT_TOKEN
        value: "test_client_token_placeholder"
      - key: SECUSCAN_PADDLE_API_KEY
        type: SECRET
        value: "paddle_api_key_placeholder"
      - key: SECUSCAN_PADDLE_WEBHOOK_SECRET
        type: SECRET
        value: "paddle_webhook_secret_placeholder"
      - key: SECUSCAN_PADDLE_PRICE_STARTER
        value: "pri_starter_plan_id_placeholder"
      - key: SECUSCAN_PADDLE_PRICE_BUSINESS
        value: "pri_business_plan_id_placeholder"

      # --- Tier 2 Credentials Encryption ----------------------------------------
      # 32 url-safe base64-encoded bytes (Fernet key).
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: SECUSCAN_CREDENTIALS_KEY
        type: SECRET
        value: "generate_fernet_key_placeholder"

static_sites:
  - name: frontend
    source_dir: /frontend
    build_command: npm run build
    output_dir: dist
    routes:
      - path: /
    envs:
      # Built into the Vite bundle at build time.
      # Points to the backend component via App Platform ingress route /api.
      - key: VITE_API_URL
        value: "${APP_URL}/api"
